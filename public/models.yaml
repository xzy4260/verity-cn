    short: 198M-A64M MoE, 核显/老机器可跑的超轻量对话模型
    content: MiniMind-3 系列 MoE 版本, 总参 198M / 每 token 激活 64M, 4 专家 Top-1 路由, 架构对齐 Qwen3-MoE。推理算力与 64M Dense 基本相当, 核显 / 老机器可跑, 内存占用约 1GB。官方 GGUF 仓库的 Q8 量化单文件, 经魔搭源下载; 配合 GBNF 可稳定约束输出结构。模型极小, 字段语义与事实准确性有限, 建议只作 格式兜底 使用。
    highlights:
    - MiniMind-3 系列 MoE 版本, 总参 198M / 每 token 激活 64M, 4 专家 Top-1 路由, 架构对齐 Qwen3-MoE。
    - 推理算力与 64M Dense 基本相当, 核显 / 老机器可跑, 内存占用约 1GB。
    - 官方 GGUF 仓库的 Q8 量化单文件, 经魔搭源下载; 配合 GBNF 可稳定约束输出结构。
    - 模型极小, 字段语义与事实准确性有限, 建议只作 格式兜底 使用。
  runtime:
    recommended_engine: llama.cpp
    supported_engines:
    - llama.cpp
    requirements:
    - 需要支持 GGUF 的 llama.cpp 系运行时。
    config:
      context_length: 4096
      max_new_tokens: 512
      temperature: 0.7
