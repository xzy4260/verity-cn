- id: minimind-3-moe
  name: MiniMind-3-MoE
  display_name: MiniMind-3-MoE
  family: MiniMind-3
  type: llm
  type_label: LLM
  description: '198M-A64M MoE, 核显/老机器可跑的超轻量对话模型


    ## 特点

    - MiniMind-3 系列 **MoE** 版本,总参 **198M** / 每 token 激活 **64M**；

    - 4 专家 Top-1 路由,架构对齐 Qwen3-MoE。

    - 推理算力与 **64M** Dense 基本相当, 核显 / 老机器可跑, 内存占用约 1GB。

    - 官方 `GGUF` 仓库的 `Q8` 量化单文件, 经魔搭源下载; 配合 `GBNF` 可稳定约束输出结构。

    - 模型极小, 字段语义与事实准确性有限, 建议只作 格式兜底 使用。

    ## 规格

    - **参数量** `198M`

    - **量化** `Q8`（GGUF）

    - **推荐引擎** `llama.cpp`

    - **架构** `moe`'
  parameter_size: 198M
  config_level: low
  license: Apache-2.0
  quantization: Q8
  tags:
  - 中文
  - 英文
  - 对话
  - MoE
  - GGUF
  - 超轻量
  capabilities:
    json_mode: false
    tools: false
    vision: false
  limits:
    context_length: 4096
    max_input_tokens: 4096
    max_output_tokens: 4096
    max_total_tokens: 4096
