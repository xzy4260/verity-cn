plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'varmite.verity'
version = '5.7.2-cn'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation files('../lib/verity-patched-5.7.2.jar')
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}

// reobf 将 official mappings 名映射回 SRG 名，产出的 class 才能在运行时使用
jar {
    archiveBaseName = 'verity-setup-classes'
    archiveVersion = ''
    destinationDirectory = file('build/libs')
}

// forge gradle 6.x: reobf 在 jar 之后运行，需显式声明任务依赖
reobf {
    jar {}
}
build.dependsOn reobfJar
